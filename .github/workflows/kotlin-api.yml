name: Kotlin API

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotlin-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ktlint, detekt, tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify
        run: ./gradlew build

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: build/reports/
          if-no-files-found: ignore

  image:
    name: Build image
    needs: verify
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=kotlin-api
          cache-to: type=gha,mode=max,scope=kotlin-api
