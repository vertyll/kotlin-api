spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/realms/kotlin-api

application:
  mail:
    from: test@kotlin-api.local
  frontend:
    url: http://localhost:8080
  keycloak:
    server-url: http://localhost:9000
    client-secret: test-secret
  auth:
    callback-url: http://localhost:8080/api/v1/auth/callback
    post-login-url: http://localhost:8080/api/v1/swagger-ui.html
