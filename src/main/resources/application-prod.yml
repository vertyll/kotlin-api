spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

application:
  mail:
    from: ${MAIL_FROM}
  frontend:
    url: ${FRONTEND_URL}
  keycloak:
    realm-url: ${KEYCLOAK_REALM_URL}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
  auth:
    callback-url: ${AUTH_CALLBACK_URL}
    post-login-url: ${AUTH_POST_LOGIN_URL}

logging:
  level:
    root: WARN
    com.vertyll.kotlinapi: INFO
