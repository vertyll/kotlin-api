spring:
  application:
    name: kotlin-api
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    validate-on-migrate: true
  data:
    redis:
      timeout: 2s
      connect-timeout: 2s
  session:
    data:
      redis:
        namespace: ${application.redis.key-prefix}:session
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${application.keycloak.realm-url}
          audiences:
            - kotlin-api
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /api/v1
    session:
      timeout: 10h
      cookie:
        name: __Host-KOTLIN_API_SESSION
        # The context path would otherwise be the cookie's path, which the __Host- prefix forbids.
        path: /
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

application:
  redis:
    key-prefix: kotlin-api
  keycloak:
    client-id: kotlin-api
